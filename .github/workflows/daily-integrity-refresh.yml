name: daily-integrity-refresh

on:
  workflow_dispatch:
  schedule:
    # 00:05 America/New_York year-round. GitHub cron is UTC, so both UTC
    # equivalents are scheduled and the gate below selects the active ET offset.
    - cron: '5 4 * * *'
    - cron: '5 5 * * *'

permissions:
  contents: write

concurrency:
  group: tokentotals-daily-integrity-refresh
  cancel-in-progress: false

jobs:
  eastern-midnight-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      eastern_now: ${{ steps.gate.outputs.eastern_now }}
    steps:
      - name: Select the 00:05 Eastern schedule
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          eastern_now="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
          eastern_offset="$(TZ=America/New_York date '+%z')"
          schedule_expr='${{ github.event.schedule }}'
          echo "eastern_now=$eastern_now" >> "$GITHUB_OUTPUT"

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo "Manual daily integrity refresh accepted at $eastern_now."
          elif [ "$schedule_expr" = '5 4 * * *' ] && [ "$eastern_offset" = '-0400' ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo "Scheduled 00:05 EDT refresh accepted at $eastern_now."
          elif [ "$schedule_expr" = '5 5 * * *' ] && [ "$eastern_offset" = '-0500' ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo "Scheduled 00:05 EST refresh accepted at $eastern_now."
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo "Skipping inactive UTC schedule $schedule_expr at $eastern_now ($eastern_offset)."
          fi

  refresh-validate-and-publish:
    needs: eastern-midnight-gate
    if: needs.eastern-midnight-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create clean integrity environment outside repository
        run: python -m venv $RUNNER_TEMP/tokentotals-integrity-venv

      - name: Verify supported Python runtime
        run: $RUNNER_TEMP/tokentotals-integrity-venv/bin/python runtime_compat.py

      - name: Install constrained test dependencies
        run: $RUNNER_TEMP/tokentotals-integrity-venv/bin/python -m pip install -c constraints-py312.txt -r requirements-dev.txt

      - name: Verify dependency graph
        run: $RUNNER_TEMP/tokentotals-integrity-venv/bin/python -m pip check

      - name: Perform scheduled daily pricing integrity refresh from live official sources
        run: $RUNNER_TEMP/tokentotals-integrity-venv/bin/python scripts/daily_integrity_refresh.py

      - name: Validate that the last successful daily refresh receipt is current
        run: $RUNNER_TEMP/tokentotals-integrity-venv/bin/python scripts/check_pricing_freshness.py

      - name: Enforce telemetry-honesty stop-line gates
        run: >-
          $RUNNER_TEMP/tokentotals-integrity-venv/bin/python -m pytest -q
          tests/test_proxy_guardrails.py::test_dashboard_has_no_fabricated_static_telemetry
          tests/test_proxy_guardrails.py::test_dashboard_dynamic_metrics_are_backed_by_status_fields

      - name: Run complete forensic regression suite
        run: $RUNNER_TEMP/tokentotals-integrity-venv/bin/python -m pytest -q

      - name: Reject unexpected refresh writes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(pricing_catalog\.json|MODEL_COMPARISON_MATRIX\.md|README\.md|TokenTotals_Security_Whitepaper\.md|docs/PRICING_DAILY_STATUS\.md)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Daily refresh modified unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Publish one atomic daily integrity commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pricing_catalog.json MODEL_COMPARISON_MATRIX.md README.md TokenTotals_Security_Whitepaper.md docs/PRICING_DAILY_STATUS.md
          if git diff --cached --quiet; then
            echo 'No generated pricing-surface changes to publish.'
          else
            git commit -m "Daily pricing integrity refresh $(date -u +%F)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
