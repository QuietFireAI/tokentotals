name: Turn Receipt API patch work

on:
  push:
    branches:
      - turn-receipt-api-work

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage Turn Receipt API patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Turn Receipt API patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          proxy_path = Path('proxy_server.py')
          proxy = proxy_path.read_text(encoding='utf-8')

          import_anchor = 'import turn_notice\n'
          if proxy.count(import_anchor) != 1:
              raise SystemExit(f'Expected one turn_notice import anchor, found {proxy.count(import_anchor)}')
          proxy = proxy.replace(import_anchor, import_anchor + 'import turn_receipt\n', 1)

          route_anchor = '''    return view\n\n\n@app.get("/api/turn-notice")\n'''
          route_block = '''    return view\n\n\n@app.get("/api/turn-receipt")\nasync def get_turn_receipt(thread_id: str):\n    key = str(thread_id).strip()\n    if not key:\n        raise HTTPException(status_code=400, detail="thread_id must be non-empty")\n    try:\n        receipt = turn_receipt.for_thread(key)\n    except turn_ledger.LedgerCorruptionError as exc:\n        raise HTTPException(\n            status_code=500,\n            detail=f"TokenTotals turn ledger is corrupt: {exc}",\n        )\n    if receipt is None:\n        raise HTTPException(\n            status_code=404,\n            detail=f"No TokenTotals Turn Receipt exists for thread '{key}'.",\n        )\n    return receipt\n\n\n@app.get("/api/turn-notice")\n'''
          if proxy.count(route_anchor) != 1:
              raise SystemExit(f'Expected one receipt route anchor, found {proxy.count(route_anchor)}')
          proxy = proxy.replace(route_anchor, route_block, 1)
          proxy_path.write_text(proxy, encoding='utf-8')

          test_path = Path('tests/test_telemetry_api.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          test_block = '''\n\n    def test_turn_receipt_endpoint_returns_canonical_receipt(self):\n        expected = {\n            "schema": "tokentotals.turn_receipt",\n            "schema_version": 1,\n            "receipt_id": "turn-3",\n            "thread": {"thread_id": "thread-1", "turn_count": 3},\n        }\n        with patch.object(proxy_server.turn_receipt, "for_thread", return_value=expected) as mocked:\n            response = self.client.get("/api/turn-receipt", params={"thread_id": "thread-1"})\n\n        self.assertEqual(response.status_code, 200)\n        self.assertEqual(response.json(), expected)\n        mocked.assert_called_once_with("thread-1")\n\n    def test_turn_receipt_endpoint_rejects_blank_thread_id(self):\n        with patch.object(proxy_server.turn_receipt, "for_thread") as mocked:\n            response = self.client.get("/api/turn-receipt", params={"thread_id": "   "})\n\n        self.assertEqual(response.status_code, 400)\n        self.assertEqual(response.json()["detail"], "thread_id must be non-empty")\n        mocked.assert_not_called()\n\n    def test_turn_receipt_endpoint_returns_404_for_unknown_thread(self):\n        with patch.object(proxy_server.turn_receipt, "for_thread", return_value=None):\n            response = self.client.get("/api/turn-receipt", params={"thread_id": "missing"})\n\n        self.assertEqual(response.status_code, 404)\n        self.assertIn("No TokenTotals Turn Receipt exists", response.json()["detail"])\n\n    def test_turn_receipt_endpoint_surfaces_ledger_corruption(self):\n        with patch.object(\n            proxy_server.turn_receipt,\n            "for_thread",\n            side_effect=turn_ledger.LedgerCorruptionError("bad line 9"),\n        ):\n            response = self.client.get("/api/turn-receipt", params={"thread_id": "thread-1"})\n\n        self.assertEqual(response.status_code, 500)\n        self.assertIn("turn ledger is corrupt", response.json()["detail"])\n        self.assertIn("bad line 9", response.json()["detail"])\n'''
          if tests.count(test_anchor) != 1:
              raise SystemExit(f'Expected one test insertion anchor, found {tests.count(test_anchor)}')
          tests = tests.replace(test_anchor, test_block + test_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/_turn_receipt_api_patch.yml').unlink()
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- proxy_server.py tests/test_telemetry_api.py

      - name: Commit patched work branch
        run: |
          git config user.name "QuietFireAI"
          git config user.email "211976194+QuietFireAI@users.noreply.github.com"
          git add proxy_server.py tests/test_telemetry_api.py .github/workflows/_turn_receipt_api_patch.yml
          git commit -m "feat: expose canonical Turn Receipt API"
          git push origin HEAD:turn-receipt-api-work
