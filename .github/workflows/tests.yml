name: tests

on:
  push:
    branches: [main, sol/forensic-hardening]
  pull_request:

jobs:
  resolve-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve current runtime graph
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          echo "=== TOKEN_TOTALS_RUNTIME_FREEZE_BEGIN ==="
          python -m pip freeze
          echo "=== TOKEN_TOTALS_RUNTIME_FREEZE_END ==="

  resolve-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve current runtime graph
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          Write-Output "=== TOKEN_TOTALS_RUNTIME_FREEZE_BEGIN ==="
          python -m pip freeze
          Write-Output "=== TOKEN_TOTALS_RUNTIME_FREEZE_END ==="

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies only
        run: python -m pip install -r requirements.txt
      - name: Verify runtime dependency graph
        run: python -m pip check
      - name: Import production proxy with declared runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata
          import litellm
          import proxy_server

          assert proxy_server.litellm is litellm
          assert callable(litellm.acompletion)
          assert getattr(litellm, "__file__", None)
          print("LiteLLM runtime dependency:", importlib.metadata.version("litellm"))
          print("proxy_server import: OK")
          PY

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused regression suite
        run: python -m pytest -q
