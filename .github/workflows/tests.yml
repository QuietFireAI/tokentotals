name: TokenTotals Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Smoke-import live proxy
        run: python -c "import proxy_server; print('proxy_server import OK')"

      - name: Run regression suite
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout --signal=TERM 90s python -m unittest discover -s tests -v
