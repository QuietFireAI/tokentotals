name: Turn Receipt lifecycle hardening work

on:
  push:
    branches:
      - turn-receipt-lifecycle-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply lifecycle hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          path = Path('proxy_server.py')
          text = path.read_text(encoding='utf-8')
          old = '''    allow_methods=["*"],\n    allow_headers=["*"],\n)\n'''
          new = '''    allow_methods=["*"],\n    allow_headers=["*"],\n    expose_headers=["X-TokenTotals-Receipt-ID"],\n)\n'''
          text = replace_once(text, old, new, 'cors receipt header exposure')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_turn_receipt_binding.py')
          text = path.read_text(encoding='utf-8')
          insert = '''\n    def test_client_cannot_spoof_server_receipt_id(self):\n        captured = {}\n        async def upstream(**kwargs):\n            captured.update(kwargs)\n            return _FakeResponse()\n        with patch.object(proxy_server, "preflight_input_estimate", return_value=(0.01, "test")), patch.object(proxy_server.litellm, "acompletion", side_effect=upstream):\n            response = self.client.post(\n                "/v1/chat/completions",\n                headers={\n                    "authorization": "Bearer test",\n                    "x-thread-id": "thread-binding",\n                    "x-tokentotals-receipt-id": "attacker-controlled",\n                },\n                json={"model": "gpt-4o", "messages": [{"role": "user", "content": "hello"}]},\n            )\n        receipt_id = response.headers.get("x-tokentotals-receipt-id")\n        self.assertTrue(receipt_id)\n        self.assertNotEqual(receipt_id, "attacker-controlled")\n        self.assertEqual(receipt_id, captured["litellm_metadata"][proxy_server.RESERVATION_METADATA_KEY])\n\n    def test_failed_upstream_has_no_receipt_binding(self):\n        async def upstream(**kwargs):\n            raise RuntimeError("provider unavailable")\n        with patch.object(proxy_server, "preflight_input_estimate", return_value=(0.01, "test")), patch.object(proxy_server.litellm, "acompletion", side_effect=upstream):\n            response = self.client.post(\n                "/v1/chat/completions",\n                headers={"authorization": "Bearer test"},\n                json={"model": "gpt-4o", "messages": [{"role": "user", "content": "hello"}]},\n            )\n        self.assertEqual(response.status_code, 502)\n        self.assertIsNone(response.headers.get("x-tokentotals-receipt-id"))\n        self.assertEqual(config_manager.get_inflight_reserved_usd(), 0.0)\n\n    def test_cors_exposes_receipt_header_to_browser_clients(self):\n        response = self.client.options(\n            "/v1/chat/completions",\n            headers={\n                "origin": "http://example.test",\n                "access-control-request-method": "POST",\n            },\n        )\n        exposed = response.headers.get("access-control-expose-headers", "").lower()\n        self.assertIn("x-tokentotals-receipt-id", exposed)\n\n    def test_stream_does_not_inject_receipt_text_into_provider_content(self):\n        async def upstream(**kwargs):\n            return _fake_stream()\n        with patch.object(proxy_server, "preflight_input_estimate", return_value=(0.01, "test")), patch.object(proxy_server.litellm, "acompletion", side_effect=upstream):\n            response = self.client.post(\n                "/v1/chat/completions",\n                headers={"authorization": "Bearer test"},\n                json={\n                    "model": "gpt-4o",\n                    "messages": [{"role": "user", "content": "hello"}],\n                    "stream": True,\n                },\n            )\n        self.assertNotIn("TURN RECEIPT", response.text)\n        self.assertNotIn("TokenTotals estimate", response.text)\n        self.assertIn('data: {"chunk":true}', response.text)\n'''
          anchor = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          text = replace_once(text, anchor, insert + anchor, 'lifecycle binding tests')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          git diff --check
          python -m compileall -q proxy_server.py tests/test_turn_receipt_binding.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Smoke-import live proxy
        run: python -c "import proxy_server; print('proxy_server import OK')"

      - name: Run full regression suite
        run: timeout --signal=TERM 90s python -m unittest discover -s tests -v

      - name: Commit proven files and remove helper
        if: success()
        run: |
          rm .github/workflows/_turn_receipt_lifecycle_hardening.yml
          git config user.name "QuietFireAI"
          git config user.email "211976194+QuietFireAI@users.noreply.github.com"
          git add proxy_server.py tests/test_turn_receipt_binding.py .github/workflows/_turn_receipt_lifecycle_hardening.yml
          git commit -m "test: harden Turn Receipt response lifecycle"
          git push origin HEAD:turn-receipt-lifecycle-hardening
