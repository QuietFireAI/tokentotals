name: TokenTotals Windows Package Smoke

on:
  push:
    branches: [main]
    paths:
      - "app_gui.py"
      - "packaging_smoke.py"
      - "proxy_server.py"
      - "config_manager.py"
      - "turn_ledger.py"
      - "turn_notice.py"
      - "turn_receipt.py"
      - "receipt_pricing.py"
      - "turn_receipt_renderer.py"
      - "turn_receipt_chat_surface.py"
      - "telemetry_view.py"
      - "runtime_model_catalog.py"
      - "openai_pricing.py"
      - "anthropic_pricing.py"
      - "google_pricing.py"
      - "pricing/**"
      - "icon*.png"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build.ps1"
      - "README.md"
      - "TURN_RECEIPTS.md"
      - "CITATION.cff"
      - ".github/workflows/windows-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "app_gui.py"
      - "packaging_smoke.py"
      - "proxy_server.py"
      - "config_manager.py"
      - "turn_ledger.py"
      - "turn_notice.py"
      - "turn_receipt.py"
      - "receipt_pricing.py"
      - "turn_receipt_renderer.py"
      - "turn_receipt_chat_surface.py"
      - "telemetry_view.py"
      - "runtime_model_catalog.py"
      - "openai_pricing.py"
      - "anthropic_pricing.py"
      - "google_pricing.py"
      - "pricing/**"
      - "icon*.png"
      - "requirements.txt"
      - "requirements-build.txt"
      - "build.ps1"
      - "README.md"
      - "TURN_RECEIPTS.md"
      - "CITATION.cff"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Build and smoke-test packaged desktop
        shell: powershell
        run: .\build.ps1

      - name: Verify packaged files
        shell: powershell
        run: |
          $root = "dist\TokenTotals"
          if (-not (Test-Path "$root\TokenTotals.exe")) { throw "Packaged EXE missing" }
          foreach ($registryName in @("openai_registry.json", "anthropic_registry.json", "google_registry.json")) {
            $matches = Get-ChildItem -Path $root -Recurse -Filter $registryName
            if ($matches.Count -ne 1) { throw "Expected exactly one bundled TokenTotals $registryName; found $($matches.Count)" }
          }
          $iconFiles = Get-ChildItem -Path $root -Recurse -Filter "icon*.png"
          if ($iconFiles.Count -lt 4) { throw "Expected four bundled tray icon files; found $($iconFiles.Count)" }
          $liteLLMBackup = Get-ChildItem -Path $root -Recurse -Filter "model_prices_and_context_window_backup.json"
          if ($liteLLMBackup.Count -lt 1) { throw "LiteLLM runtime pricing/context backup data is missing from package" }

      - name: Create candidate ZIP
        shell: powershell
        run: Compress-Archive -Path "dist\TokenTotals\*" -DestinationPath "TokenTotals_Windows_candidate.zip" -Force

      - name: Record candidate ZIP identity
        id: candidate_identity
        shell: powershell
        run: |
          $candidate = Get-Item "TokenTotals_Windows_candidate.zip"
          $hash = (Get-FileHash $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = $candidate.Length
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "size_bytes=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "CANDIDATE_ZIP_SHA256=$hash"
          Write-Host "CANDIDATE_ZIP_SIZE_BYTES=$size"

      - name: Upload smoke-tested candidate
        id: upload_candidate
        uses: actions/upload-artifact@v4
        with:
          name: TokenTotals-Windows-candidate-${{ steps.candidate_identity.outputs.sha256 }}
          path: TokenTotals_Windows_candidate.zip
          if-no-files-found: error
          retention-days: 14

      - name: Record Actions artifact identity
        shell: powershell
        run: |
          Write-Host "CANDIDATE_ZIP_SHA256=${{ steps.candidate_identity.outputs.sha256 }}"
          Write-Host "CANDIDATE_ZIP_SIZE_BYTES=${{ steps.candidate_identity.outputs.size_bytes }}"
          Write-Host "ACTIONS_ARTIFACT_ID=${{ steps.upload_candidate.outputs.artifact-id }}"
          Write-Host "ACTIONS_ARTIFACT_DIGEST=${{ steps.upload_candidate.outputs.artifact-digest }}"
          Write-Host "ACTIONS_ARTIFACT_URL=${{ steps.upload_candidate.outputs.artifact-url }}"
