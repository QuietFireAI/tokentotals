name: Apply receipt visual rule

on:
  push:
    branches: [post-v2.6-usability-audit]
    paths:
      - "tools/_apply_receipt_visual_rule.py"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-v2.6-usability-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Apply visual rule
        run: python tools/_apply_receipt_visual_rule.py
      - name: Compile
        run: python -m compileall -q .
      - name: Regression
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout --signal=TERM 90s python -m unittest discover -s tests -v
      - name: Commit tested product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn_receipt_renderer.py tests/test_turn_receipt_renderer.py
          git diff --cached --check
          git commit -m "ui: keep Turn Receipt footer to the product URL"
          git push origin HEAD:post-v2.6-usability-audit
