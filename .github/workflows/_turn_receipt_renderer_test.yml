name: Turn Receipt renderer work

on:
  push:
    branches:
      - turn-receipt-renderer-work

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify sources
        run: |
          git diff --check HEAD~1 HEAD || true
          python -m compileall -q turn_receipt_renderer.py tests/test_turn_receipt_renderer.py
          python -c "import turn_receipt_renderer; print('renderer import OK')"
      - name: Run full regression suite
        run: timeout --signal=TERM 90s python -m unittest discover -s tests -v
